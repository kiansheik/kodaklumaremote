<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Philips!</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101827; color: #f5f8ff; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 26px; }
    main { max-width: 1500px; width: 90%; margin: 0 auto; padding: 4vh 0; }
    .eyebrow { color: #7ee8d3; font-size: 22px; letter-spacing: 3px; margin: 0 0 12px; }
    h1 { font-size: 72px; line-height: 1.1; margin: 0 0 16px; }
    .intro { color: #c6d4e8; line-height: 1.5; margin: 0 0 22px; }
    .status { background: #1a2b40; border-left: 7px solid #7ee8d3; padding: 16px 22px; margin-bottom: 24px; }
    #clock { font-size: 42px; color: #7ee8d3; margin-right: 24px; white-space: nowrap; }
    #runtime { white-space: nowrap; }
    .tiles { width: 100%; border-spacing: 12px; table-layout: fixed; margin: 0 -12px; }
    .tiles td { width: 33.333%; vertical-align: top; }
    .tile { display: block; width: 100%; min-height: 100px; padding: 18px 12px; border: 3px solid #43536b; border-radius: 9px; background: #1a2b40; color: #f5f8ff; text-align: center; font-size: 29px; font-family: inherit; }
    .tile.selected { border-color: #ffdc73; background: #ffdc73; color: #101827; }
    .tile:focus { outline: 3px solid #7ee8d3; outline-offset: 3px; }
    .label { display: block; font-size: 17px; margin-top: 7px; }
    #result { min-height: 40px; font-size: 29px; margin: 20px 0 12px; color: #ffdc73; }
    .hint { color: #c6d4e8; font-size: 22px; line-height: 1.5; margin: 8px 0; }
    .small { color: #94abc5; font-size: 18px; line-height: 1.5; margin: 8px 0; }
    @media (max-width: 900px), (max-height: 800px) {
      body { font-size: 20px; }
      main { padding: 3vh 0; }
      h1 { font-size: 48px; }
      .intro { margin-bottom: 14px; }
      .eyebrow { font-size: 17px; }
      .status { margin-bottom: 12px; padding: 12px 16px; }
      #clock { font-size: 30px; }
      .tile { font-size: 23px; min-height: 78px; padding: 12px 7px; }
      .label { font-size: 15px; }
      #result { font-size: 23px; margin-top: 12px; }
      .hint { font-size: 18px; }
      .small { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LOCAL TV EXPERIMENT</p>
    <h1>Hello, Philips!</h1>
    <p class="intro">A tiny web app running in this browser. Use your remote to try it.</p>
    <div class="status" role="status">
      <span id="clock">--:--:--</span>
      <span id="runtime">Waiting for JavaScript...</span>
    </div>
    <table class="tiles" aria-label="Remote control playground">
      <tbody>
        <tr>
          <td><button class="tile selected" type="button" data-tile="0">Hello<span class="label">Your first TV web app</span></button></td>
          <td><button class="tile" type="button" data-tile="1">Clock<span class="label">Updates every second</span></button></td>
          <td><button class="tile" type="button" data-tile="2">Remote<span class="label">Arrows and OK</span></button></td>
        </tr>
        <tr>
          <td><button class="tile" type="button" data-tile="3">Browser<span class="label">HTML + CSS + JavaScript</span></button></td>
          <td><button class="tile" type="button" data-tile="4">Local<span class="label">No media or account needed</span></button></td>
          <td><button class="tile" type="button" data-tile="5">Ready<span class="label">Choose a tile and press OK</span></button></td>
        </tr>
      </tbody>
    </table>
    <p id="result" aria-live="polite">Ready for your remote.</p>
    <p class="hint">Move: &#8592; &#8593; &#8594; &#8595; &nbsp; Select: OK &nbsp; Back: leave with your browser</p>
    <p class="small" id="report-status">Local proof reporting: waiting.</p>
    <noscript><p>JavaScript is disabled. The page loaded, but the interactive proof cannot run.</p></noscript>
  </main>
  <script>
    (function () {
      'use strict';
      var started = new Date().getTime();
      var sequence = 0;
      var ticks = 0;
      var selected = 0;
      var activations = 0;
      var lastKeyAt = 0;
      var tiles = document.getElementsByTagName('button');
      var names = ['Hello', 'Clock', 'Remote', 'Browser', 'Local', 'Ready'];
      var clock = document.getElementById('clock');
      var runtime = document.getElementById('runtime');
      var result = document.getElementById('result');
      var reportStatus = document.getElementById('report-status');

      function put(element, text) {
        if ('textContent' in element) element.textContent = text;
        else element.innerText = text;
      }

      function pad(value) { return value < 10 ? '0' + value : String(value); }

      function elapsed() { return Math.max(0, Math.floor((new Date().getTime() - started) / 1000)); }

      function report(event, key) {
        var request;
        var payload = { v: 1, event: event, sequence: ++sequence, uptimeSeconds: elapsed() };
        if (key) payload.key = key;
        try {
          request = new XMLHttpRequest();
          request.open('POST', 'report', true);
          request.setRequestHeader('Content-Type', 'application/json');
          request.timeout = 3000;
          request.onreadystatechange = function () {
            if (request.readyState !== 4) return;
            put(reportStatus, request.status >= 200 && request.status < 300 ?
              'Local proof reporting: received by the Mac.' :
              'Local proof reporting: unavailable. The page still works.');
          };
          request.onerror = request.ontimeout = function () {
            put(reportStatus, 'Local proof reporting: unavailable. The page still works.');
          };
          request.send(JSON.stringify(payload));
        } catch (error) {
          put(reportStatus, 'Local proof reporting: unavailable. The page still works.');
        }
      }

      function render() {
        var index;
        for (index = 0; index < tiles.length; index++) {
          tiles[index].className = index === selected ? 'tile selected' : 'tile';
          tiles[index].setAttribute('aria-pressed', index === selected ? 'true' : 'false');
          tiles[index].setAttribute('tabindex', index === selected ? '0' : '-1');
        }
      }

      function activate() {
        activations++;
        put(result, 'OK! ' + names[selected] + ' selected. Total selections: ' + activations + '.');
      }

      function keyName(event) {
        var code = event.which || event.keyCode;
        var key = event.key;
        if (key === 'ArrowLeft' || key === 'Left' || code === 37) return 'left';
        if (key === 'ArrowUp' || key === 'Up' || code === 38) return 'up';
        if (key === 'ArrowRight' || key === 'Right' || code === 39) return 'right';
        if (key === 'ArrowDown' || key === 'Down' || code === 40) return 'down';
        if (key === 'Enter' || key === 'Select' || code === 13) return 'ok';
        if (key === 'Backspace' || key === 'BrowserBack' || key === 'GoBack' || code === 8 || code === 461) return 'back';
        return 'other';
      }

      function onKey(event) {
        var key;
        var now = new Date().getTime();
        var row = Math.floor(selected / 3);
        var column = selected % 3;
        event = event || window.event;
        key = keyName(event);
        // Browser Back remains available even when this page observes its key.
        if (key !== 'back' && key !== 'other') {
          if (event.preventDefault) event.preventDefault();
          event.returnValue = false;
        }
        if (now - lastKeyAt < 120) return;
        lastKeyAt = now;
        if (key === 'left') column = (column + 2) % 3;
        if (key === 'right') column = (column + 1) % 3;
        if (key === 'up' || key === 'down') row = 1 - row;
        selected = row * 3 + column;
        render();
        if (key !== 'back' && key !== 'other') tiles[selected].focus();
        if (key === 'ok') activate();
        else if (key === 'back') put(result, 'Back received. Browser navigation remains available.');
        else if (key === 'other') put(result, 'Key received. Try the arrows or OK.');
        else put(result, key.toUpperCase() + ' received. ' + names[selected] + ' is highlighted.');
        // Unknown keys can include typed text. Report only the fixed category.
        report('key', key);
      }

      function tick() {
        var date = new Date();
        put(clock, pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds()));
        put(runtime, 'JavaScript running - ' + elapsed() + 's');
        if (ticks > 0 && ticks % 10 === 0) report('heartbeat');
        ticks++;
      }

      var index;
      for (index = 0; index < tiles.length; index++) {
        (function (tile, position) {
          tile.onclick = function () {
            selected = position;
            render();
            activate();
            report('key', 'ok');
          };
        }(tiles[index], index));
      }
      if (document.addEventListener) document.addEventListener('keydown', onKey, false);
      else if (document.attachEvent) document.attachEvent('onkeydown', onKey);
      render();
      tick();
      report('ready');
      window.setInterval(tick, 1000);
    }());
  </script>
</body>
</html>
