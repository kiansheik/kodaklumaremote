apply plugin: 'com.android.application'

def mobileRepository = rootProject.projectDir.parentFile
def matterArtifacts = new File(mobileRepository, '.local/matter-sdk/artifacts')
def bundleMobileAssets = tasks.register('bundleMobileAssets', Exec) {
    workingDir mobileRepository
    commandLine 'node', new File(mobileRepository, 'scripts/build-mobile.mjs').absolutePath
    inputs.files(fileTree(new File(mobileRepository, 'src/mobile')),
        fileTree(new File(mobileRepository, 'src/msx')),
        fileTree(new File(mobileRepository, 'src/handoff')),
        new File(mobileRepository, 'src/shared/media.js'),
        new File(mobileRepository, 'scripts/build-mobile.mjs'),
        new File(mobileRepository, 'package.json'),
        new File(mobileRepository, 'package-lock.json'))
    outputs.dir(layout.buildDirectory.dir('generated/lumaAssets'))
}
tasks.named('preBuild').configure { dependsOn(bundleMobileAssets) }
def verifyMatterSdk = tasks.register('verifyMatterSdk', Exec) {
    workingDir mobileRepository
    commandLine 'node', new File(mobileRepository, 'scripts/verify-matter-sdk.mjs').absolutePath
}
tasks.named('preBuild').configure { dependsOn(verifyMatterSdk) }

android {
    namespace 'dev.framextv.lumaremote'
    compileSdk 35
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.framextv.lumaremote'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '0.4.5'
        testInstrumentationRunner 'dev.framextv.lumaremote.BackendInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main {
        assets.srcDirs = [layout.buildDirectory.dir('generated/lumaAssets'), new File(matterArtifacts, 'assets')]
        jniLibs.srcDirs = [new File(matterArtifacts, 'jniLibs')]
    } }
    signingConfigs {
        release {
            def signingPath = System.getenv('LUMA_KEYSTORE_PATH')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('LUMA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUMA_KEY_ALIAS')
                keyPassword System.getenv('LUMA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Keep emulator fixture state separate from installed signed releases.
            if (project.findProperty('receiverFixture') == 'true') applicationIdSuffix '.receiverfixture'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    implementation fileTree(dir: new File(matterArtifacts, 'libs'), include: ['*.jar'])
}

tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            ['LUMA_KEYSTORE_PATH', 'LUMA_KEYSTORE_PASSWORD', 'LUMA_KEY_ALIAS', 'LUMA_KEY_PASSWORD'].each {
                if (!System.getenv(it)) throw new GradleException("Set ${it} privately to sign a release APK.")
            }
        }
    }
}
